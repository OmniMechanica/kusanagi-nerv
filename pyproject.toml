[project]
name = "kusanagi-nerv"
version = "0.1.0"
description = "A learning platform for self-service ML training and inference."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.20.1,<2",
    "asyncpg>=0.32,<1",
    "fastapi>=0.162.2,<1",
    "pydantic>=2.14.3,<3",
    "sqlalchemy[asyncio]>=2.1.8,<3",
    "uvicorn>=0.54,<1",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
markers = ["integration: requires a real PostgreSQL server and creates isolated test databases"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1,<2",
    "ruff>=0.17.4",
]
