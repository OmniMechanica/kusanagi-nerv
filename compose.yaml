name: kusanagi-nerv

services:
  postgres:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      # Public local-development credentials, never production credentials.
      POSTGRES_USER: kusanagi
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: kusanagi
    ports:
      - "127.0.0.1:${KUSANAGI_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kusanagi -d kusanagi"]
      interval: 2s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: kusanagi-local
      AWS_SECRET_ACCESS_KEY: local-development-only
      S3_BUCKET: kusanagi-training
    ports:
      - "127.0.0.1:${KUSANAGI_S3_PORT:-58333}:8333"
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  s3-data:
