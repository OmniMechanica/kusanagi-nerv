name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install the pinned Python
        run: uv python install

      - name: Install locked dependencies and package
        run: uv sync --locked

      - name: Check lint
        run: uv run --locked ruff check src tests migrations

      - name: Check formatting
        run: uv run --locked ruff format --check src tests migrations

      - name: Run tests
        run: uv run --locked pytest -q -m 'not integration and not ray and not ray_jobs and not training and not ray_train and not recovery'

      - name: Build the package
        run: uv build

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: kusanagi
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kusanagi -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      KUSANAGI_TEST_DATABASE_URL: postgresql+asyncpg://kusanagi:local-development-only@127.0.0.1:5432/postgres
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install the pinned Python
        run: uv python install
      - name: Install locked dependencies and package
        run: uv sync --locked
      - name: Verify migrations, persistence and concurrent writes
        run: uv run --locked pytest -q tests/integration -m 'not ray_jobs and not recovery'

  ray:
    name: Ray Core CPU
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install the pinned Python
        run: uv python install
      - name: Install locked dependencies and package with Ray
        run: uv sync --locked --extra ray
      - name: Verify real CPU tasks, actor state, limits and failures
        run: uv run --locked --extra ray pytest -q tests/ray

  ray_jobs:
    name: Ray Jobs integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: kusanagi
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kusanagi -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      KUSANAGI_TEST_DATABASE_URL: postgresql+asyncpg://kusanagi:local-development-only@127.0.0.1:5432/postgres
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install the pinned Python
        run: uv python install
      - name: Install locked dependencies with Ray Jobs
        run: uv sync --locked --extra ray-jobs
      - name: Verify real API, controller, Ray Jobs and PostgreSQL recovery
        run: uv run --locked --extra ray-jobs pytest -q tests/integration -m ray_jobs

  training:
    name: PyTorch CPU training
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install the pinned Python
        run: uv python install
      - name: Install locked dependencies with CPU PyTorch
        run: uv sync --locked --extra training
      - name: Verify training reproducibility and artifact loading
        run: uv run --locked --extra training pytest -q tests/training

  ray_train:
    name: Ray Train CPU DDP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install the pinned Python
        run: uv python install
      - name: Install locked dependencies with Ray Train
        run: uv sync --locked --extra ray-train
      - name: Verify distributed training and GPU placement behavior
        run: uv run --locked --extra ray-train pytest -q tests/ray_train

  recovery:
    name: S3 checkpoint recovery
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: kusanagi
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kusanagi -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      KUSANAGI_TEST_DATABASE_URL: postgresql+asyncpg://kusanagi:local-development-only@127.0.0.1:5432/postgres
      KUSANAGI_S3_ENDPOINT: http://127.0.0.1:58333
      KUSANAGI_S3_BUCKET: kusanagi-training
      KUSANAGI_S3_ACCESS_KEY: kusanagi-local
      KUSANAGI_S3_SECRET_KEY: local-development-only
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install the pinned Python and recovery dependencies
        run: uv python install && uv sync --locked --extra recovery
      - name: Start the S3-compatible store
        run: docker compose up -d --wait s3
      - name: Recover from worker death using a persisted checkpoint
        run: uv run --locked --extra recovery pytest -q tests/integration -m recovery
      - name: Stop the S3 test service
        if: always()
        run: docker compose down --volumes
