name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install the pinned Python
        run: uv python install

      - name: Install locked dependencies and package
        run: uv sync --locked

      - name: Check lint
        run: uv run --locked ruff check src tests migrations

      - name: Check formatting
        run: uv run --locked ruff format --check src tests migrations

      - name: Run tests
        run: uv run --locked pytest -q -m 'not integration and not ray'

      - name: Build the package
        run: uv build

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: kusanagi
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kusanagi -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      KUSANAGI_TEST_DATABASE_URL: postgresql+asyncpg://kusanagi:local-development-only@127.0.0.1:5432/postgres
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install the pinned Python
        run: uv python install
      - name: Install locked dependencies and package
        run: uv sync --locked
      - name: Verify migrations, persistence and concurrent writes
        run: uv run --locked pytest -q tests/integration

  ray:
    name: Ray Core CPU
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install the pinned Python
        run: uv python install
      - name: Install locked dependencies and package with Ray
        run: uv sync --locked --extra ray
      - name: Verify real CPU tasks, actor state, limits and failures
        run: uv run --locked --extra ray pytest -q tests/ray
